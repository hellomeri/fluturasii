<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#D6E8F8">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Portalul grupei mici B, Grădinița 246: evenimente, necesar, cine se ocupă de ce și banii grupei.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-26 -23 52 44'%3E%3Cellipse cx='-11' cy='-8' rx='12' ry='9' transform='rotate(-25 -11 -8)' fill='%23F0A92B'/%3E%3Cellipse cx='11' cy='-8' rx='12' ry='9' transform='rotate(25 11 -8)' fill='%23F0A92B'/%3E%3Cellipse cx='-9' cy='8' rx='8' ry='6.5' transform='rotate(30 -9 8)' fill='%23A88BEF'/%3E%3Cellipse cx='9' cy='8' rx='8' ry='6.5' transform='rotate(-30 9 8)' fill='%23A88BEF'/%3E%3Crect x='-2' y='-12' width='4' height='26' rx='2' fill='%232B2238'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<title>Fluturașii · Grupa mică B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* Layout: bandă de antet bleu pastel cu fluture; pe telefon navigare fixă jos; câte un item pe rând (pe desktop: detalii stânga, acțiune dreapta) */
:root{
  color-scheme:light;
  --bg:#F7FAFD; --surface:#FFFFFF; --surface-2:#EBF2FA; --ink:#123A63; --muted:#5B7591; --line:#DCE7F2;
  --wing:#3A86D1; --wing-ink:#1F5E9E; --wing-soft:#E2EEFA; --on-wing:#FFFFFF;
  --meadow:#2E7A55; --meadow-soft:#DCEEE3;
  --lilac:#7457C4; --lilac-soft:#ECE6FA;
  --berry:#BE3F37; --berry-soft:#F8E0DC;
  --head:#D6E8F8; --head-ink:#123A63; --head-muted:#4F6E8F;
  --logo1:#F7B731; --logo2:#3A86D1; --logo3:#123A63; --me:#3A86D1;
  --shadow:0 1px 0 rgba(18,58,99,.04),0 10px 24px -18px rgba(18,58,99,.3);
  --f-display:"Baloo 2",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1A2A; --surface:#15243A; --surface-2:#1C2E48; --ink:#E6F0FA; --muted:#9DB2C9; --line:#263A57;
  --wing:#5AA2E8; --wing-ink:#9CCBF5; --wing-soft:#183253; --on-wing:#FFFFFF;
  --meadow:#62BE90; --meadow-soft:#1D3328;
  --lilac:#A78DF2; --lilac-soft:#2D2544;
  --berry:#F08077; --berry-soft:#3C2125;
  --head:#12263F; --head-ink:#E6F0FA; --head-muted:#9DB2C9;
  --logo1:#F7B731; --logo2:#5AA2E8; --logo3:#E6F0FA; --me:#5AA2E8;
  --shadow:0 1px 0 rgba(0,0,0,.2); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1A2A; --surface:#15243A; --surface-2:#1C2E48; --ink:#E6F0FA; --muted:#9DB2C9; --line:#263A57;
  --wing:#5AA2E8; --wing-ink:#9CCBF5; --wing-soft:#183253; --on-wing:#FFFFFF;
  --meadow:#62BE90; --meadow-soft:#1D3328;
  --lilac:#A78DF2; --lilac-soft:#2D2544;
  --berry:#F08077; --berry-soft:#3C2125;
  --head:#12263F; --head-ink:#E6F0FA; --head-muted:#9DB2C9;
  --logo1:#F7B731; --logo2:#5AA2E8; --logo3:#E6F0FA; --me:#5AA2E8;
  --shadow:0 1px 0 rgba(0,0,0,.2); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body.gated .tabs,body.gated .bottom-nav,body.gated #meBtn{display:none}
body.gated main{padding-bottom:48px}
.gate{display:grid;place-items:center;padding-block:24px}
.gate-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px;max-width:440px;width:100%;display:grid;gap:12px;box-shadow:var(--shadow)}
.gate-card h2{font-size:24px;font-weight:800}
.gate-card p{margin:0}
.gate-err{color:var(--berry);font-weight:700}
img{max-width:100%}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--wing);outline-offset:2px;border-radius:8px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}
/* Safari: grilele nu au voie să se lățească după conținut */
.view,.quick,.people,.months,.comments,.coll,.gsteps,.cal-list,.i-main,.i-act,.item,.cbody,.cfom,.modal,.secblock,.done-list,.pick{grid-template-columns:minmax(0,1fr)}
.view>*,.quick>*,.people>*,.two>*,.grid>*,.coll>*,.money>*,.timeline>*,.item>*,section{min-width:0;max-width:100%}

/* Antet */
.top{background:var(--head);color:var(--head-ink)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:18px 14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 240px}
.brand svg{flex:none;width:52px;height:44px}
.brand h1{font-size:30px;font-weight:800;letter-spacing:.2px}
.brand p{margin:0;color:var(--head-muted);font-size:13px;font-weight:600;letter-spacing:.3px}
.me{display:inline-flex;align-items:center;gap:8px;border:1px solid color-mix(in srgb,var(--head-ink) 25%,transparent);background:color-mix(in srgb,var(--head-ink) 8%,transparent);color:var(--head-ink);padding:7px 12px 7px 7px;border-radius:999px;font-weight:700;font-size:14px;max-width:100%}
.me:hover{background:color-mix(in srgb,var(--head-ink) 16%,transparent)}
.me .av{width:28px;height:28px;font-size:12px;color:#fff}
.me span.lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:4px;padding-block:0 0}
.tab{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--head-muted);padding:10px 14px 12px;font-weight:800;font-size:15px;border-radius:12px 12px 0 0;position:relative}
.tab svg{width:18px;height:18px}
.tab[aria-current="page"]{background:var(--bg);color:var(--ink)}
.tab:not([aria-current="page"]):hover{color:var(--head-ink)}

/* Navigare telefon */
.bottom-nav{display:none}
@media (max-width:720px){
  .tabs{display:none}
  .top .wrap{padding-block:14px 14px}
  .brand h1{font-size:26px}
  .bottom-nav{display:grid;grid-template-columns:repeat(var(--n,4),1fr);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 6px 16px -14px rgba(0,0,0,.35);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .bottom-nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 7px;font-size:11.5px;font-weight:800;color:var(--muted);border-bottom:3px solid transparent}
  .bottom-nav button[aria-current="page"]{border-bottom-color:var(--wing)}
  :root{--navh:62px}
  input,select,textarea,.sel,.inp,.ta{font-size:16px!important}
  .bottom-nav button svg{width:22px;height:22px}
  .bottom-nav button[aria-current="page"]{color:var(--ink)}
  .bottom-nav button[aria-current="page"] svg{color:var(--wing)}
  main{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
}
main{padding-block:22px 48px;overflow-x:clip}
html,body{max-width:100%;overflow-x:hidden;overflow-x:clip}
body{touch-action:pan-y pinch-zoom;overscroll-behavior-x:none}
p,h1,h2,h3,h4,b,small,span{overflow-wrap:break-word}
.view{display:grid;gap:28px}

/* Secțiuni */
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.sec-head h2{font-size:24px;font-weight:800}
.sec-head .sub{color:var(--muted);font-size:14px;margin-top:2px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:800;white-space:nowrap}
.chip.wing{background:var(--wing-soft);color:var(--wing-ink)}
.chip.meadow{background:var(--meadow-soft);color:var(--meadow)}
.chip.lilac{background:var(--lilac-soft);color:var(--lilac)}
.chip.berry{background:var(--berry-soft);color:var(--berry)}
.chip.plain{background:var(--surface-2);color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:12px;font-weight:800;font-size:14px;min-height:38px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn.wingb{background:var(--wing);border-color:var(--wing);color:var(--on-wing)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.small{min-height:32px;padding:5px 10px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--berry)}
.btn[disabled]{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px}

/* Anunț */
.notice{display:flex;gap:14px;align-items:flex-start;background:var(--wing-soft);border-radius:var(--r);padding:16px 18px}
.notice svg{flex:none;width:26px;height:26px;color:var(--wing-ink)}
.notice p{margin:0;font-weight:700;white-space:pre-line}
.notice .who{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--wing-ink);margin-bottom:2px}

/* Evenimente următoare */
.timeline{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:14px}
.timeline > *{min-width:0}
.ev{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;box-shadow:var(--shadow);width:100%;min-width:0;max-width:100%;cursor:pointer}
.ev:hover{border-color:var(--ink)}
.ev h3{overflow-wrap:anywhere}
.ev .when{overflow-wrap:anywhere}
.cal{width:58px;border-radius:12px;overflow:hidden;text-align:center;background:var(--surface-2);flex:none}
.cal .m{background:var(--wing);color:var(--on-wing);font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:3px 0}
.cal .d{font-family:var(--f-display);font-size:26px;font-weight:800;line-height:1.25;padding:2px 0 0}
.cal .w{font-size:11px;font-weight:700;color:var(--muted);padding-bottom:5px}
.ev h3{font-size:19px;font-weight:800}
.ev .when{color:var(--muted);font-size:13.5px;font-weight:600;margin:2px 0 10px}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--meadow);border-radius:99px}
.bar.wing i{background:var(--wing)}
.ev .prog{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--muted);margin-top:6px}
.ev .first{grid-column:1/-1}
.ev .prog.info-line{color:var(--ink);font-size:14px;font-weight:700;margin-top:0}

/* Liste rapide */
.quick{display:grid;gap:8px}
.qrow{cursor:pointer;min-width:0;max-width:100%;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px 10px 14px;text-align:left;width:100%}
.qrow:hover{border-color:var(--ink)}
.qrow .t{flex:1;min-width:0}
.qrow .t b{display:block;font-weight:800;font-size:15px}
.qrow .t small{color:var(--muted);font-size:13px;font-weight:600}
.qrow .dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--wing)}
.done-list{margin-top:16px}
.todo-grp + .todo-grp{margin-top:16px}
.todo-grp .eyebrow{margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline}
.pay-h{color:var(--berry)}
.pay-h .num{font-size:14px;letter-spacing:0;text-transform:none}
.qrow.pay{border-color:color-mix(in srgb,var(--berry) 35%,var(--line))}
.qrow .pright{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none;margin-left:auto;padding-left:8px}
.qrow .pright .pamt{margin:0;padding:0}
.qrow .pamt{font-weight:800;font-size:15px;white-space:nowrap;margin-left:auto;padding-left:8px}
.done-h{color:var(--meadow);margin-bottom:8px}
.qrow.ok{background:var(--meadow-soft);border-color:transparent}
.qrow.ok .t b{color:var(--meadow)}
.qrow.ok small{color:var(--meadow)}
.okmark{width:22px;height:22px;border-radius:50%;background:var(--meadow);color:#fff;display:grid;place-items:center;flex:none}
.okmark svg{width:13px;height:13px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
@media (max-width:860px){.two{grid-template-columns:minmax(0,1fr)}}
.calnow{background:var(--wing-soft);color:var(--wing-ink);border-radius:14px;padding:12px 16px;font-size:15px;font-weight:600}
.calnow.vac{background:var(--meadow-soft);color:var(--meadow)}
.calall{margin-top:8px}
.cal-list{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:2px;max-width:640px}
.calrow{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;padding:7px 12px;border-radius:10px;font-size:14px}
.calrow .cdot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.calrow.vac .cdot{background:var(--meadow)}
.calrow.free .cdot{background:var(--wing)}
.calrow.vac .cn{font-weight:800}
.calrow .cd{color:var(--muted);font-weight:700;white-space:nowrap}
.calrow.now{background:var(--surface);box-shadow:inset 0 0 0 2px var(--wing)}
.calrow.past{opacity:.5}
.hdr-acts{display:flex;align-items:center;gap:8px;max-width:100%}
.helpbtn{display:inline-flex;align-items:center;gap:4px;border:1px solid color-mix(in srgb,var(--head-ink) 25%,transparent);background:color-mix(in srgb,var(--head-ink) 8%,transparent);color:var(--head-ink);border-radius:999px;padding:7px 14px;font-weight:800;font-size:14px;min-height:42px}
.helpbtn:hover{background:color-mix(in srgb,var(--head-ink) 16%,transparent)}
@media (max-width:420px){.helpbtn span{display:none}.helpbtn{width:42px;justify-content:center;padding:0}}
.guide-hint{background:var(--surface);border:1px solid var(--line)}
.guide-hint .gh-ico{font-size:24px;line-height:1}
.guide-hint .who{color:var(--wing-ink)}
.guide-hint p{font-weight:600}
.gtoc{display:flex;flex-wrap:wrap;gap:8px}
.gsec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 8px;scroll-margin-top:16px}
.gsec h2{font-size:21px;font-weight:800;margin-bottom:12px}
.gsteps{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.gstep{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.gstep:last-child{border-bottom:0}
.gnum{min-width:30px;height:30px;padding:0 8px;border-radius:999px;background:var(--wing-soft);color:var(--wing-ink);display:grid;place-items:center;font-weight:800;font-size:13px}
.gbody{min-width:0}
.gbody h3{font-size:16.5px;font-weight:800;margin-bottom:4px}
.gbody p{margin:0 0 6px;line-height:1.7}
.gbtn{display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:1px 9px;font-weight:800;font-size:13.5px;white-space:nowrap;line-height:1.6}
.gbtn.blue{background:var(--wing);border-color:var(--wing);color:var(--on-wing)}
.gbtn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.gbtn.chip{background:var(--surface-2);border-color:transparent;color:var(--muted);border-radius:999px}
.gbtn.tick{border:2px dashed var(--line)}
.gbtn.st-todo{background:var(--wing-soft);color:var(--wing-ink);border-color:transparent;border-radius:999px}
.gbtn.st-prog{background:var(--lilac-soft);color:var(--lilac);border-color:transparent;border-radius:999px}
.gbtn.st-done{background:var(--meadow-soft);color:var(--meadow);border-color:transparent;border-radius:999px}
.gbtn.x{color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.segb{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14.5px;display:inline-flex;align-items:center;gap:6px}
.segb small{font-weight:600;color:var(--muted)}
.segb.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.segb.small{padding:5px 12px;font-size:13px}
.months-seg{margin-top:10px}
.optinfo{margin-top:12px;background:var(--surface-2);border-radius:12px;padding:10px 14px;font-size:14.5px;font-weight:600}
.optmonth{margin-top:-8px}
.opt-tiles{margin-bottom:14px}
.optlist{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.orow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.orow.mine{box-shadow:inset 0 0 0 2px var(--me)}
.orow .on{min-width:0}
.orow .on b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{display:flex;align-items:center;gap:4px;margin-top:3px;flex-wrap:wrap}
.dots{gap:3px}
.dots i{font-style:normal;min-width:24px;height:22px;padding:0 4px;border-radius:7px;border:1.5px dashed var(--line);display:inline-grid;place-items:center;font-size:11.5px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.dots i.p{background:var(--meadow);border:1.5px solid var(--meadow);color:#fff}
.dots span{font-size:12.5px;font-weight:800;color:var(--muted);margin-left:4px}
.oright{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.osum{font-weight:800;font-size:15px;white-space:nowrap}
.opaid{border:0;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800;background:var(--wing-soft);color:var(--wing-ink);white-space:nowrap}
.opaid.on{background:var(--meadow-soft);color:var(--meadow)}
.opaid.none{background:transparent;color:var(--muted)}
button.opaid{cursor:pointer;min-height:26px}
button.opaid.own{background:var(--surface);border:1.5px solid var(--meadow);color:var(--meadow)}
.paybtn{border:0;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:800;background:var(--meadow);color:#fff;cursor:pointer;white-space:nowrap;min-height:32px;font-family:inherit}
.paybtn.undo{background:transparent;color:var(--muted);border:1px solid var(--line);padding:4px 10px;font-size:12px;min-height:28px}
.qrow.ok .paybtn.undo{margin-left:auto;flex:none}
.mestat{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.kid.decl i{border-color:var(--meadow);border-style:dashed}
.kid small{font-weight:700;color:var(--meadow);font-size:11px}
.linkcopy{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;min-height:28px;vertical-align:middle}
.linkcopy:hover{color:var(--ink);border-color:var(--ink)}
.gsec h2 .linkcopy{margin-left:6px}
.impsum{font-size:14px}
.implist{display:grid;gap:6px;max-height:44vh;overflow:auto}
.improw{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.2fr);gap:8px;align-items:center;font-size:13.5px}
.improw .xn{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.improw .xc{color:var(--muted);font-weight:700}

  while (y < endY || (y === endY && m <= 5)) { if (hasSchoolDaysLeft(y, m)) out.push({ key: y+"-"+pad(m+1), label: LUNI[m][0].toUpperCase()+LUNI[m].slice(1), y }); m++; if (m>11){m=0;y++;} }

function calendarCard(){
  const t = todayStr(); const P = AN_SCOLAR.perioade;
  const cur = P.find(p => t >= p.s && t <= p.e); const nextVac = P.find(p => p.tip === "vac" && p.s > t);

async function boot(){
  if (!gateOk()) { showGate(); return; }
  document.body.classList.remove("gated");
  render();
  if (!window.supabase || SUPABASE_URL.indexOf("__") === 0) { ui.mode = "nodb"; render(); return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  cap.db = db;
  ui.authorHash = await sha256(ui.device);
  try { await checkAdmin(); } catch(e){}
  sb.auth.onAuthStateChange(() => setTimeout(() => checkAdmin().then(render).catch(()=>{}), 0));
  ui.mode = "live";
  await Promise.all(COLS.map(refetch));
  if (!ui.loaded.has("itemi")) { ui.mode = "nodb"; render(); return; }
  const timers = {};
  sb.channel("fluturasi").on("postgres_changes", { event:"*", schema:"public" }, p => { const t = p.table; if (!COLS.includes(t)) return; clearTimeout(timers[t]); timers[t] = setTimeout(() => refetch(t), 250); }).subscribe();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") COLS.forEach(refetch); });
}

let pending = false, raf = 0, rto = 0;
function schedule(){
  const a = document.activeElement;
  if (a && a.closest && a.closest("#view") && /^(INPUT|TEXTAREA)$/.test(a.tagName)) { pending = true; return; }
  cancelAnimationFrame(raf); clearTimeout(rto); raf = requestAnimationFrame(() => { clearTimeout(rto); render(); }); rto = setTimeout(() => { cancelAnimationFrame(raf); render(); }, 250);
}
document.addEventListener("focusout", () => { if (pending) setTimeout(() => { const a = document.activeElement; if (!(a && a.closest && a.closest("#view") && /^(INPUT|TEXTAREA)$/.test(a.tagName))) { pending = false; render(); } }, 0); });

async function write(fn, okMsg){
  if (!sb) { toast("Portalul nu e conectat la baza de date.", true); return false; }
  try { await fn(db); if (okMsg) toast(okMsg); return true; }
  catch(e){
    const code = e && e.code;
    if (code === "23505") toast("Ești deja trecut aici sau locul a fost luat între timp. Lista s-a actualizat.", true);
    else if (code === "not_owner") toast("Poți retrage doar ce ai adăugat de pe acest telefon sau calculator. Pentru altceva, scrie-i administratoarei.", true);
    else if (code === "42501" || /row-level security/i.test(e.message||"")) toast("Doar administratoarea poate face această modificare.", true);
    else toast("Nu s-a salvat. Verifică internetul și încearcă din nou.", true);
    COLS.forEach(refetch);
    return false;
  }
}

function viewNecesar(){
  const secs = D.sectiuni.filter(s => !isEvent(s)).sort((a,b)=>(a.ordine||0)-(b.ordine||0));

function eventLists(){
  const t = todayStr();

    up: evs.filter(s => s.data && s.data >= t).sort((a,b)=>a.data.localeCompare(b.data)),
    nodate: evs.filter(s => !s.data).sort((a,b)=>(a.ordine||0)-(b.ordine||0)),

}

  const toks = normName(name).split(" ").filter(Boolean); let best = null, bs = 0;
  for (const k of sortedKids()) { const kt = normName(k.nume).split(" "); let sc = 0; for (const t of toks) { if (kt.includes(t)) sc += 2; else if (t.length >= 4 && kt.some(x => x.length >= 4 && lev(x, t) <= 2)) sc += 1; } if (sc > bs) { bs = sc; best = k; } }

  return best ? best.id : "";
}
const LUNA_MAP = { ian:1, feb:2, mar:3, apr:4, mai:5, iun:6, iul:7, aug:8, sep:9, oct:10, noi:11, nov:11, dec:12 };
function schoolYearStart(){ const d = new Date(); return d.getMonth() >= 7 ? d.getFullYear() : d.getFullYear() - 1; }
function parseDateCell(v){

  if (typeof v === "number" && v > 20000) return isoOf(new Date(Math.round((v - 25569) * 86400000)));
  const m = /(\d{1,2})\s*[.\-\/ ]\s*([A-Za-zăâîșțĂÂÎȘȚ]+|\d{1,2})/.exec(String(v)); if (!m) return null;
  const day = +m[1]; const mw = normName(m[2]).toLowerCase(); const mon = /^\d+$/.test(m[2]) ? +m[2] : (LUNA_MAP[mw.slice(0,3)] || 0);
  if (!mon || day < 1 || day > 31) return null; const y = mon >= 8 ? ys : ys + 1;
  return y+"-"+pad(mon)+"-"+pad(day);
}
function parseAttendance(wb){
  const ws = wb.Sheets[wb.SheetNames[0]]; const rows = XLSX.utils.sheet_to_json(ws, { header:1, raw:true, defval:null });
  const txt = c => String(c == null ? "" : c);
  const title = (rows.find(r => r && r.some(c => txt(c).trim())) || []).find(c => txt(c).trim()) || "";
  const hdr = rows.findIndex(r => r && r.some(c => /nume/i.test(txt(c)))); if (hdr < 0) throw new Error("Nu găsesc coloana cu numele copiilor.");
  const H = rows[hdr]; const nameCol = H.findIndex(c => /nume/i.test(txt(c)));
  let endCol = H.findIndex((c, i) => i > nameCol && /total|pret|preț|valoare/i.test(txt(c))); if (endCol < 0) endCol = Math.max(...rows.map(r => r ? r.length : 0));

function viewMoney(){
  const rows = D.financiar.slice().sort((a,b)=>String(b.data).localeCompare(String(a.data)) || String(b.creat).localeCompare(String(a.creat)));
  const inn = rows.filter(r=>r.tip==="in").reduce((a,r)=>a+(+r.suma||0),0);
  const out = rows.filter(r=>r.tip==="out").reduce((a,r)=>a+(+r.suma||0),0);
  const bal = { cont:0, cash:0, adelina:0 };
  for (const r of rows) { const src = srcOf(r), dst = dstOf(r), v = +r.suma||0;
    if (r.tip === "in") bal[src] += v; else if (r.tip === "out") bal[src] -= v; else if (r.tip === "transfer") { bal[src] -= v; bal[dst] += v; } }
  const shown = Object.keys(SURSE).filter(k => k !== "adelina" || rows.some(r => srcOf(r) === "adelina" || (r.tip === "transfer" && dstOf(r) === "adelina")));
  const r2 = n => Math.round(n*100)/100;
  let h = '<section><div class="sec-head"><div><h2>Bugetul grupei</h2><div class="sub">Tot ce s-a strâns și s-a cheltuit, la vedere pentru toți părinții.</div></div>'
    + (cap.admin ? '<div class="row"><button class="btn small primary" data-a="finEdit" data-tip="in">'+ICON.plus+'Încasare</button><button class="btn small" data-a="finEdit" data-tip="out">'+ICON.plus+'Cheltuială</button><button class="btn small" data-a="finEdit" data-tip="transfer">'+ICON.plus+'Mutare cont ↔ cash</button></div>' : '') + '</div>';
  h += '<div class="money" style="--n:'+shown.length+'"><div class="tile big"><div class="lab">Sold total</div><div class="val">'+lei(r2(shown.reduce((a,k)=>a+bal[k],0)))+'</div>'+(shown.some(k=>r2(bal[k])<0) ? '<div class="note big-note">După ce se dau înapoi banii avansați</div>' : '')+'</div>'
    + shown.map(k => '<div class="tile"><div class="lab">'+SURSE[k].lung+'</div><div class="val'+(r2(bal[k])<0?' out':'')+'">'+lei(r2(bal[k]))+'</div>'+(r2(bal[k])<0 ? '<div class="note">Grupa are de dat înapoi '+lei(-r2(bal[k]))+'</div>' : '')+'</div>').join("") + '</div>'
    + '<div class="money-sub num"><span>Strânși în total: <b class="in">'+lei(inn)+'</b></span><span>Cheltuiți în total: <b class="out">'+lei(out)+'</b></span></div></section>';

  h += viewStrangeri(rows);

  h += '<section><div class="sec-head"><div><h2>Mișcări</h2><div class="sub">Cea mai recentă sus.</div></div></div>';
  if (!rows.length) h += '<div class="empty">'+(cap.admin ? 'Nu ai notat încă nicio sumă. Începe cu o încasare.' : 'Nu s-a notat încă nicio sumă.')+'</div>';
  const grouped = [], seen = {};
  for (const r of rows) {
    if (r.colectaId && r.tip === "in") { const k = r.colectaId+"|"+srcOf(r); if (seen[k]) { seen[k].suma = r2(+seen[k].suma + (+r.suma||0)); seen[k].n++; continue; }
      const c = D.colecte.find(x => x.id === r.colectaId); seen[k] = Object.assign({}, r, { id:"", grup:true, n:1, descriere:"Strângere: "+(c ? c.titlu : "contribuții"), itemId:"", copilId:"" }); grouped.push(seen[k]); }
    else grouped.push(r);
  }
  for (const g of grouped) if (g.grup) g.descriere += " · "+g.n+(g.n===1?" copil":" copii");
  if (rows.length) h += '<div class="ledger">' + grouped.map(r => {
    const it = r.itemId ? D.itemi.find(i=>i.id===r.itemId) : null;
    const sub = [it ? it.titlu : "", r.copilId ? kidName(r.copilId) : ""].filter(Boolean).join(" · ");
    const src = srcOf(r); const where = r.tip === "transfer" ? SURSE[src].scurt+" → "+SURSE[dstOf(r)].scurt : SURSE[src].scurt;
    const cls = r.tip === "in" ? "in" : r.tip === "out" ? "out" : "mv"; const sign = r.tip === "in" ? "+" : r.tip === "out" ? "−" : "";
    return '<div class="lrow"><span class="d num">'+esc(fmtShort(r.data))+'</span><span class="desc"><b>'+esc(r.descriere || (r.tip==="in"?"Încasare":r.tip==="out"?"Cheltuială":"Mutare de bani"))+'</b><small><span class="src '+(r.tip==="transfer"?"mv":src)+'">'+where+'</span>'+(sub?' '+esc(sub):'')+'</small></span><span class="amt '+cls+'">'+sign+lei(r.suma)+'</span>'
      + (cap.admin && !r.grup ? '<button class="x" aria-label="Editează" title="Editează" data-a="finEdit" data-id="'+esc(r.id)+'">'+ICON.pen+'</button>' : (r.grup ? '<button class="x" aria-label="Vezi strângerea" title="Vezi strângerea" data-a="goColl" data-id="'+esc(r.colectaId)+'">'+ICON.list+'</button>' : '<span></span>')) + '</div>';
  }).join("") + '</div>';
  return h + '</section>';
}

/* ---------- evenimente ---------- */
function setTab(k){ ui.tab = k; LS.set("fl_tab", k); syncHash(); render(); window.scrollTo({ top:0 }); }
function goTo(elId){
  setTimeout(() => { const el = document.getElementById(elId); if (!el) return; const det = el.closest("details"); if (det) det.open = true; el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start" }); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }, 30);
}
function tabOfSec(s){ return isEvent(s) ? "evenimente" : "necesar"; }
function needMe(then){ if (kid(ui.me)) return true; openPicker(then); return false; }

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-a]"); if (!t) return;
  const a = t.dataset.a, id = t.dataset.id;
  if (a === "closeScrim") { if (e.target === t && !pickForced) closeModal(); return; }
  if (t.tagName === "SELECT" || t.tagName === "FORM") return;
  switch (a) {
    case "tab": if (t.dataset.k === "ghid") LS.set("fl_ghid","1"); setTab(t.dataset.k); break;
    case "ghidOk": LS.set("fl_ghid","1"); render(); break;
    case "goG": syncHash("ghid/"+id); goTo("g-"+id); break;
    case "pick": openPicker(); break;
    case "close": closeModal(); break;
    case "pickKid": if (!id) break; pickForced = false; ui.me = id; LS.set("fl_me", id); closeModal(); render(); if (afterPick) { const f = afterPick; afterPick = null; f(); } break;
    case "goSec": { const s = sec(id); setTab(tabOfSec(s)); if (s) syncHash(secPath(s)); goTo("sec-"+id); break; }
    case "goItem": { const it = D.itemi.find(i=>i.id===id); if (!it) break; setTab(tabOfSec(sec(it.sectiune))); goTo("item-"+id); break; }
    case "toggleC": ui.openC.has(id) ? ui.openC.delete(id) : ui.openC.add(id); render(); if (ui.openC.has(id)) { const ta = document.getElementById("cm-"+id); if (ta && matchMedia("(min-width:721px)").matches) ta.focus(); } break;
    case "takeIt": t.disabled = true; await setStare(id, { responsabil: ui.me, status: (D.stari[id]||{}).status === "done" ? "done" : "progress" }) && toast("Mulțumim! Te ocupi tu."); break;
    case "tick": {
      const k = t.dataset.kid; const ex = D.inscrieri.find(s => s.itemId===id && s.copilId===k);
      t.disabled = true;
      if (ex) await write(db => db.doc("inscrieri/"+ex.id).delete(), "Debifat");
      else await write(db => db.collection("inscrieri").doc().set({ itemId:id, copilId:k, nota:"", cheie:"", autor:authorId(), creat:new Date().toISOString() }), "Bifat ✓");
      break;
    }
    case "slot": {
      if (!needMe()) break; const key = t.dataset.key;
      if (D.inscrieri.some(s=>s.itemId===id && s.cheie===key)) { toast("Luna asta a fost deja luată.", true); break; }
      t.disabled = true;
      await write(db => db.collection("inscrieri").doc().set({ itemId:id, copilId:ui.me, nota:"", cheie:key, autor:authorId(), creat:new Date().toISOString() }), "Luna e a ta. Mulțumim!");
      break;
    }
    case "clearResp": t.disabled = true; await setStare(id, { responsabil:"" }) && toast("Retras"); break;
    case "vote": {
      const v = +t.dataset.v; const cur = votesOf(id).mine; const nv = +cur === v ? 0 : v;
      t.disabled = true;
      await write(async () => { chk(await sb.rpc("voteaza", { p_com:id, p_token:ui.device, p_val:nv, p_copil: kid(ui.me) ? ui.me : "" })); await refetch("voturi"); });
      break;
    }
    case "voteI": {
      const v = +t.dataset.v; const cur = votesOfInsc(id).mine; const nv = +cur === v ? 0 : v;
      t.disabled = true;
      await write(async () => { chk(await sb.rpc("voteaza_insc", { p_insc:id, p_token:ui.device, p_val:nv, p_copil: kid(ui.me) ? ui.me : "" })); await refetch("voturi_insc"); });
      break;
    }
    case "replyI": ui.replyTo = id ? "i:"+id : ""; render(); if (id) { const ta = document.getElementById("ri-"+id); if (ta) ta.focus(); } break;
    case "reply": ui.replyTo = id || ""; render(); if (id) { const ta = document.getElementById("rp-"+id); if (ta) ta.focus(); } break;
    case "unsign": t.disabled = true; await write(db => db.doc("inscrieri/"+id).delete(), "Retras"); break;
    case "delC": {
      if (ui.confirm !== "c"+id) { ui.confirm = "c"+id; t.innerHTML = '<span style="font-size:11px;font-weight:800;color:var(--berry)">Sigur?</span>'; t.style.width = "auto"; setTimeout(()=>{ if (ui.confirm==="c"+id) { ui.confirm=null; render(); } }, 3500); break; }
      ui.confirm = null; await write(db => db.doc("comentarii/"+id).delete(), "Comentariu șters"); break;
    }
    case "settings": settingsForm(); break;
    case "optSel": ui.opt = id; ui.optLuna = ""; syncHash(); render(); break;
    case "optLuna": ui.optLuna = id; syncHash(); render(); break;
    case "goOpt": { const l = D.optional_luni.find(x=>x.id===id); if (l) { ui.opt = l.optionalId; ui.optLuna = l.id; } setTab("optionale"); break; }
    case "optImport": IMP = null; importForm(); break;
    case "optEdit": optEditForm(id); break;
    case "optPaid": { const p = D.optional_prezente.find(x=>x.id===id); if (!p) break; t.disabled = true; const body = Object.assign({}, p, { platit: !p.platit, dataPlata: !p.platit ? todayStr() : "" }); delete body.id; await write(db => db.doc("optional_prezente/"+id).set(body), body.platit ? "Marcat plătit: "+firstName(kidName(p.copilId)) : "Marcat de plată"); break; }
    case "optDelLuna":
      if (ui.confirm !== "ol"+id) { ui.confirm = "ol"+id; t.textContent = "Sigur? Apasă iar"; break; }
      ui.confirm = null; await write(async db => { chk(await sb.from("optional_luni").delete().eq("id", id)); await refetch("optional_prezente"); await refetch("optional_luni"); }, "Luna a fost ștearsă"); break;
    case "pickIcon": { const inp = document.getElementById("fs-i"); if (inp) inp.value = t.dataset.v; break; }
    case "login": loginForm(); break;
    case "logout": await sb.auth.signOut(); cap.admin = false; ui.adminEmail = ""; render(); toast("Ai ieșit din administrare"); break;
    case "secEdit": secForm(id); break;
    case "itemEdit": itemForm(id, t.dataset.sec); break;
    case "finEdit": finForm(id, t.dataset.tip); break;
    case "delItem":
      if (ui.confirm !== "item"+id) { ui.confirm = "item"+id; t.textContent = "Sigur? Apasă iar"; break; }
      await write(async db => { for (const s of D.inscrieri.filter(x=>x.itemId===id)) await db.doc("inscrieri/"+s.id).delete(); for (const c of D.comentarii.filter(x=>x.itemId===id)) await db.doc("comentarii/"+c.id).delete(); await db.doc("stari/"+id).delete(); await db.doc("itemi/"+id).delete(); }, "Item șters"); closeModal(); break;
    case "delSec":
      if (ui.confirm !== "sec"+id) { ui.confirm = "sec"+id; t.textContent = "Șterge și itemii ei?"; break; }
      await write(async db => { for (const it of D.itemi.filter(x=>x.sectiune===id)) { await db.doc("stari/"+it.id).delete(); await db.doc("itemi/"+it.id).delete(); } await db.doc("sectiuni/"+id).delete(); }, "Secțiune ștearsă"); closeModal(); break;
    case "delFin":
      if (ui.confirm !== "fin"+id) { ui.confirm = "fin"+id; t.textContent = "Sigur? Apasă iar"; break; }
      await write(db => db.doc("financiar/"+id).delete(), "Șters"); closeModal(); break;
    case "paid": {
      const k = t.dataset.kid; const c = D.colecte.find(x=>x.id===id); if (!c) break;
      const ex = D.financiar.find(r => r.tip==="in" && r.colectaId===id && r.copilId===k);
      t.disabled = true;
      if (ex) await write(db => db.doc("financiar/"+ex.id).delete(), "Debifat: "+firstName(kidName(k)));
      else await write(db => db.collection("financiar").doc().set({ tip:"in", sursa:srcOf(c), destinatie:"", suma:+c.suma||0, descriere:"Contribuție "+kidName(k), data:todayStr(), itemId:"", copilId:k, colectaId:id, creat:new Date().toISOString() }), "Bifat: "+firstName(kidName(k))+" ✓");
      break;
    }
    case "collEdit": collForm(id); break;
    case "collToggle": { const c = D.colecte.find(x=>x.id===id); if (!c) break; const body = Object.assign({}, c, { inchisa: !c.inchisa }); delete body.id; await write(db => db.doc("colecte/"+id).set(body), body.inchisa ? "Strângere încheiată" : "Strângere redeschisă"); break; }
    case "delColl": {
      if (ui.confirm !== "coll"+id) { const n = D.financiar.filter(r=>r.colectaId===id).length; ui.confirm = "coll"+id; t.textContent = n ? "Șterge și cele "+n+" contribuții?" : "Sigur? Apasă iar"; break; }
      await write(async db => { for (const r of D.financiar.filter(x=>x.colectaId===id)) await db.doc("financiar/"+r.id).delete(); await db.doc("colecte/"+id).delete(); }, "Strângere ștearsă"); closeModal(); break;
    }
    case "goColl": goTo("coll-"+id); break;
    case "goCollTab": setTab("bani"); syncHash("buget/"+id); goTo("coll-"+id); break;
    case "payMark": {
      if (!needMe()) break;
      const tip = t.dataset.t, ref = t.dataset.ref, on = t.dataset.on === "1", k = t.dataset.kid || ui.me;
      t.disabled = true;
      if (tip === "colecta" && cap.admin && on) {
        const c = D.colecte.find(x=>x.id===ref); if (!c || collStats(c).ids.has(k)) break;
        await write(db => db.collection("financiar").doc().set({ tip:"in", sursa:srcOf(c), destinatie:"", suma:+c.suma||0, descriere:"Contribuție "+kidName(k), data:todayStr(), itemId:"", copilId:k, colectaId:ref, creat:new Date().toISOString() }), "Marcat plătit: "+firstName(kidName(k))+" ✓");
        break;
      }
      await write(async () => { chk(await sb.rpc("marcheaza_platit", { p_tip: tip, p_ref: ref, p_copil: k, p_on: on })); await refetch(tip === "colecta" ? "plati_declarate" : "optional_prezente"); },
        on ? (tip === "colecta" ? "Notat ✓ Se confirmă când ajung banii." : "Marcat plătit ✓") : "Anulat");
      break;
    }
    case "copyLink": {
      const url = location.origin + location.pathname + "#" + t.dataset.h;
      syncHash(t.dataset.h);
      let ok = false; try { await navigator.clipboard.writeText(url); ok = true; } catch(e){}
      if (!ok) { try { const ta = document.createElement("textarea"); ta.value = url; ta.setAttribute("readonly",""); ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); ok = document.execCommand("copy"); ta.remove(); } catch(e){} }
      toast(ok ? "Link copiat. Îl poți lipi pe WhatsApp." : url);
      break;
    }
  }
});

document.addEventListener("change", e => { if (e.target && e.target.id === "ff-tip") { const l = document.getElementById("ff-src-l"); if (l) l.textContent = e.target.value === "transfer" ? "Banii pleacă din" : "Unde"; const w = document.getElementById("ff-dst-w"); if (w) w.hidden = e.target.value !== "transfer"; } });
document.addEventListener("change", async e => {
  const t = e.target; if (!t) return;
  if (t.id === "fx-f" && t.files && t.files[0]) {
    try { await loadXLSX(); const buf = await t.files[0].arrayBuffer(); const wb = XLSX.read(buf, { type:"array", cellDates:true }); IMP = parseAttendance(wb);
      const o = D.optionale.find(x => normName(IMP.title).includes(normName(x.nume)) || normName(x.nume).includes(normName(IMP.title))); if (o) { const s = document.getElementById("fx-o"); if (s) s.value = o.id; }
      renderImportPreview(); }
    catch(err){ IMP = null; const el = document.getElementById("impPrev"); if (el) el.innerHTML = '<p class="gate-err">Nu am putut citi fișierul: '+esc(err.message||err)+'</p>'; }
  }
  if (t.dataset && t.dataset.imp != null && IMP) { IMP.kids[+t.dataset.imp].copilId = t.value; renderImportPreview(); }
});
document.addEventListener("change", e => { if (e.target && e.target.id === "evsel" && e.target.value) { const id = e.target.value; e.target.value = ""; goTo("sec-"+id); } });
document.addEventListener("change", async e => {
  const t = e.target.closest("select[data-a]"); if (!t) return;
  const id = t.dataset.id;
  if (t.dataset.a === "status") await setStare(id, { status: t.value }) && toast("Status: "+STATUS[t.value]);
  if (t.dataset.a === "resp") await setStare(id, Object.assign({ responsabil: t.value }, t.value && (D.stari[id]||{}).status !== "done" ? { status:"progress" } : {})) && toast(t.value ? "Se ocupă "+kidName(t.value) : "Nimeni nu se mai ocupă");
});

document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "pickQ") { const q = t.value.trim().toLowerCase(); document.querySelectorAll("#pickList button").forEach(b => b.hidden = q && !b.dataset.n.includes(q)); return; }
  const f = t.closest("form[data-a]"); if (!f) return;
  if (f.dataset.a === "comment") ui.drafts[f.dataset.insc ? "i:"+f.dataset.insc : f.dataset.parent ? "r:"+f.dataset.parent : f.dataset.id] = t.value;
  if (f.dataset.a === "sign") { if (t.name === "bucati") ui.qty[f.dataset.id] = t.value; else ui.notes[f.dataset.id] = t.value; }
});

document.addEventListener("keydown", e => { const rb = e.target && e.target.closest && e.target.closest('[role="button"][data-a]'); if (rb && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); rb.click(); } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#modalRoot").innerHTML && !pickForced) closeModal(); });

document.addEventListener("submit", async e => {
  e.preventDefault();
  const f = e.target; const fid = f.getAttribute("id"); const fd = Object.fromEntries(new FormData(f).entries());
  if (fid === "fGate") { if (gateNorm(fd.raspuns).includes("raluca")) { LS.set("fl_ok","1"); try { sessionStorage.setItem("fl_ok","1"); } catch(e){} boot(); } else showGate(true); return; }
  const btn = f.querySelector('[type="submit"]'); if (btn) btn.disabled = true;
  const now = new Date().toISOString();
  try {
    if (f.dataset.a === "comment") {
      const text = (fd.text||"").trim(); if (!text) return;
      const id = f.dataset.id; const parent = f.dataset.parent || ""; const insc = f.dataset.insc || ""; const kidId = kid(ui.me) ? ui.me : "";
      const dk = insc ? "i:"+insc : parent ? "r:"+parent : id;
      if (await write(db => db.collection("comentarii").doc().set(Object.assign({ itemId:id, copilId:kidId, text, parentId:parent, autor:authorId(), creat:now }, insc ? { inscriereId:insc } : {})), parent || insc ? "Răspuns trimis" : "Comentariu trimis")) { ui.drafts[dk] = ""; if (parent || insc) ui.replyTo = ""; document.activeElement && document.activeElement.blur(); render(); }
    } else if (f.dataset.a === "sign") {
      if (!needMe()) return; const id = f.dataset.id;
      const bucati = Math.max(0, Math.min(999, parseInt(fd.bucati, 10) || 0));
      const who = kid(fd.pentru) ? fd.pentru : ui.me;
      if (await write(db => db.collection("inscrieri").doc().set({ itemId:id, copilId:who, nota:(fd.nota||"").trim(), bucati, cheie:"", autor:authorId(), creat:now }), bucati ? "Ai preluat "+bucati+" buc. Mulțumim!" : "Te-ai înscris. Mulțumim!")) {
        ui.notes[id] = ""; delete ui.qty[id];
        if (cap.admin && ((D.stari[id]||{}).status||"todo") === "todo") await setStare(id, { status:"progress" });
        document.activeElement && document.activeElement.blur(); render();
      }
    } else if (fid === "fItem") {
      const id = fd.id || ("i"+uid());
      const prev = D.itemi.find(i=>i.id===id) || {};
      const maxO = Math.max(0, ...D.itemi.filter(i=>i.sectiune===fd.sectiune).map(i=>+i.ordine||0));
      const body = { sectiune:fd.sectiune, titlu:fd.titlu.trim(), detalii:fd.detalii.trim(), tip:fd.tip, cantitate:fd.cantitate.trim(), cost:fd.cost.trim(), bifa:(fd.bifa||"").trim(), ordine: prev.sectiune===fd.sectiune ? (prev.ordine||maxO+1) : maxO+1, creat: prev.creat || now };
      const ok = await write(async db => { await db.doc("itemi/"+id).set(body); if (((D.stari[id]||{}).status||"todo") !== fd.status) { const cur = Object.assign({ status:"todo", responsabil:"" }, D.stari[id]||{}); delete cur.id; await db.doc("stari/"+id).set(Object.assign(cur, { status:fd.status, modificat:now })); } }, "Item salvat");
      if (ok) closeModal();
    } else if (fid === "fSec") {
      const id = fd.id || ("s"+uid()); const prev = sec(id) || {};
      const body = { titlu:fd.titlu.trim(), data:fd.data||"", ora: fd.oraTbd ? "tbd" : (fd.ora||""), descriere:fd.descriere.trim(), icon:(fd.icon||"").trim(), categorie:fd.categorie||"", ordine: prev.ordine || (Math.max(0, ...D.sectiuni.map(s=>+s.ordine||0))+1) };
      if (await write(db => db.doc("sectiuni/"+id).set(body), "Secțiune salvată")) closeModal();
    } else if (fid === "fFin") {
      const id = fd.id || newUuid(); const prev = D.financiar.find(r=>r.id===id) || {};
      const body = { tip:fd.tip, sursa: SURSE[fd.sursa] ? fd.sursa : "cont", destinatie: fd.tip === "transfer" && SURSE[fd.destinatie] ? fd.destinatie : "", suma:+fd.suma||0, descriere:fd.descriere.trim(), data:fd.data, itemId:fd.itemId||"", copilId:fd.copilId||"", creat: prev.creat || now };
      if (await write(db => db.doc("financiar/"+id).set(body), "Salvat")) closeModal();
    } else if (fid === "fColl") {
      const id = fd.id || ("c"+uid()); const prev = D.colecte.find(x=>x.id===id) || {};
      const body = { titlu:fd.titlu.trim(), suma:+fd.suma||0, sursa: SURSE[fd.sursa] ? fd.sursa : "cont", data:fd.data, descriere:(fd.descriere||"").trim(), inchisa: !!prev.inchisa, creat: prev.creat || now };
      if (await write(db => db.doc("colecte/"+id).set(body), "Strângere salvată")) closeModal();
    } else if (fid === "fOpt") {
      const o = D.optionale.find(x=>x.id===fd.id) || {}; const body = Object.assign({}, o, { nume:fd.nume.trim(), icon:(fd.icon||"").trim(), descriere:(fd.descriere||"").trim() }); delete body.id;
      if (await write(db => db.doc("optionale/"+fd.id).set(body), "Salvat")) closeModal();
    } else if (fid === "fImp") {
      if (!IMP) { toast("Alege întâi fișierul.", true); return; }
      const opt = fd.opt; const luna = fd.luna || IMP.luna; const pret = +fd.pret || 0; const lid = opt+"-"+luna;
      const rows = IMP.kids.filter(k => k.copilId).map(k => { const id = lid+"_"+k.copilId; const prev = D.optional_prezente.find(x=>x.id===id); return { id, luna_id: lid, copil_id: k.copilId, prezente: k.pres, platit: prev ? !!prev.platit : false, data_plata: prev ? (prev.dataPlata||"") : "" }; });
      const ok = await write(async () => {
        chk(await sb.from("optional_luni").upsert({ id: lid, optional_id: opt, luna, sedinte: IMP.dates, pret }));
        chk(await sb.from("optional_prezente").upsert(rows));
        await refetch("optional_luni"); await refetch("optional_prezente");
      }, "Prezența a fost salvată ("+rows.length+" copii)");
      if (ok) { ui.opt = opt; ui.optLuna = lid; IMP = null; closeModal(); render(); }
    } else if (fid === "fLogin") {
      const r = await sb.auth.signInWithPassword({ email: fd.email.trim(), password: fd.parola });
      if (r.error) { toast("Email sau parolă greșită.", true); return; }
      await checkAdmin();
      if (!cap.admin) { toast("Contul acesta nu are drept de administrare.", true); await sb.auth.signOut(); return; }
      closeModal(); render(); toast("Bun venit! Poți adăuga și edita.");
    } else if (fid === "fSet") {
      const names = fd.copii.split("\n").map(s=>s.trim()).filter(Boolean);
      const ok = await write(async db => {
        if ((D.setari.anunt||"") !== fd.anunt.trim()) await db.doc("setari/general").set({ anunt: fd.anunt.trim() });
        const byName = new Map(sortedKids().map(c => [c.nume, c]));
        const keep = new Set();
        for (let i=0;i<names.length;i++) { const ex = byName.get(names[i]); if (ex) { keep.add(ex.id); if (+ex.ordine !== i+1) await db.doc("copii/"+ex.id).set({ nume:ex.nume, ordine:i+1 }); } else { await db.doc("copii/k"+uid()).set({ nume:names[i], ordine:i+1 }); } }
        for (const c of sortedKids()) if (!keep.has(c.id)) await db.doc("copii/"+c.id).delete();
      }, "Salvat");
      if (ok) closeModal();
    }
  } finally { if (btn && document.body.contains(btn)) btn.disabled = false; }
});

window.addEventListener("hashchange", () => { if (parseRoute()) { LS.set("fl_tab", ui.tab); render(); if (!routeTarget) window.scrollTo({ top:0 }); } });

boot();
})();
</script>
</body>
</html>
